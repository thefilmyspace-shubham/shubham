<svg id="S" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>
<script>
// ---------------------------------------------------------------- timeline
let SEGS=[], ENV=[], TOTAL=33.25;
const SHOTS=[ // output-time ranges -> animated shot
 [0,2.2,'door'],[2.2,4.3,'wide'],[4.3,6.5,'close'],[6.5,8.5,'wide'],[8.5,11.0,'waiter'],[11.0,13.5,'wide'],
 [13.5,17.4,'close'],[17.4,20.1,'wide'],[20.1,21.1,'sushi'],[21.1,23.8,'sushi2'],[23.8,25.5,'eat'],[25.5,27.9,'delight'],[27.9,99,'logo']];
const SPEAK=[[2.4,4.1,'w'],[4.4,6.3,'c'],[6.7,13.34,'w'],[13.7,17.23,'c'],[17.5,19.93,'w'],[21.2,23.62,'w'],[25.5,27.6,'c']];
const CAPS=[[2.4,4.15,"Hello sir! Aaj kya lenge?"],[4.4,6.3,"Wahi… regular laga do"],
 [6.7,8.3,"Sir, ek baat bolun?"],[8.7,9.8,"Aap har baar naye outfit"],[9.8,10.95,"mein aate ho…"],[11.2,13.4,"Par order hamesha wahi regular!"],
 [13.7,14.9,"Haan yaar…"],[14.9,16.1,"Mujhe nayi cheezein"],[16.1,17.3,"explore karna pasand hai"],
 [17.5,18.7,"To phir aaj khaane mein bhi"],[18.7,19.98,"kuch naya try kijiye!"],
 [21.2,22.2,"Fresh sushi,"],[22.2,23.65,"authentic sauce ke saath"],[25.5,27.6,"Mmm… kya cheez hai ye!"]];

const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,u)=>a+(b-a)*u;
const ease=u=>{u=cl(u);return u*u*(3-2*u)}, eout=u=>1-Math.pow(1-cl(u),3);
const sin=Math.sin, cos=Math.cos, PI=Math.PI, f=n=>n.toFixed(1);
function srcTime(t){let a=0;for(const [i,o] of SEGS){const d=o-i;if(t<a+d)return i+(t-a);a+=d}const l=SEGS[SEGS.length-1];return l[1]+(t-a)}
function shotAt(s){for(const sh of SHOTS)if(s>=sh[0]&&s<sh[1])return sh;return SHOTS[SHOTS.length-1]}
function speaker(s){for(const [a,b,w] of SPEAK)if(s>=a&&s<b)return w;return null}
function shade(hex,k){const n=parseInt(hex.slice(1),16);const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(cl(v*k,0,255)));return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
const blink=(t,seed)=>{const p=(t+seed)%3.3;return p<0.13?1-Math.abs(p-0.065)/0.065:0};

// ---------------------------------------------------------------- characters
const CUST={skin:'#cf9468',shirt:'#827e6b',pants:'#aab5a8',shoe:'#e8e4da',hair:'cust',beard:true,must:true};
const W1={skin:'#96633f',shirt:'#b6a0dc',pants:'#2a2d36',shoe:'#17181c',hair:'short',must:false};
const W2={skin:'#a06b45',shirt:'#6b2a96',pants:'#1b1c22',shoe:'#17181c',hair:'short2',must:true};

function head(c,p){ // local coords: face centre 0,0, radius ~100
 const dx=(p.dx||0)*15, sk=c.skin, sh=shade(sk,.82), o=p.open||0, bl=p.blink||0, HC=c.hair=='cust'?'#16110e':'#111013';
 let s='';
 if(c.hair=='cust') s+=`<path d="M-102,-30 C-126,-104 -92,-172 -8,-168 C70,-182 128,-122 104,-30 C112,22 108,62 92,86 L66,50 L-66,50 L-92,86 C-108,62 -112,22 -102,-30Z" fill="${HC}"/>`;
 s+=`<rect x="-34" y="66" width="68" height="90" rx="22" fill="${sh}"/>`;
 s+=`<ellipse cx="${-93+dx*.4}" cy="6" rx="16" ry="25" fill="${sh}"/><ellipse cx="${93+dx*.4}" cy="6" rx="16" ry="25" fill="${sh}"/>`;
 s+=`<path d="M-90,-20 C-90,-98 90,-98 90,-20 C92,60 56,117 0,117 C-56,117 -92,60 -90,-20Z" fill="${sk}"/>`;
 if(c.beard) s+=`<path d="M-90,-14 C-93,62 -56,123 0,123 C56,123 93,62 90,-14 C85,46 58,98 ${dx},99 C-58,98 -85,46 -90,-14Z" fill="#1c1511"/>`;
 s+=`<g transform="translate(${f(dx)},${p.fy||0})">`;
 const by=-40-(p.brow||0)*9;
 s+=`<path d="M-56,${by+4} Q-36,${by-9} -16,${by+1}" stroke="${HC}" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M16,${by+1} Q36,${by-9} 56,${by+4}" stroke="${HC}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
 if(p.happy){ s+=`<path d="M-52,-8 Q-36,-24 -20,-8" stroke="#1a1310" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M20,-8 Q36,-24 52,-8" stroke="#1a1310" stroke-width="7" fill="none" stroke-linecap="round"/>`; }
 else { const ry=12*(1-bl)*(1+(p.wide||0)*.25)+0.6, lx=(p.lx||0)*6+dx*.25, ly=(p.ly||0)*5;
  for(const ex of [-36,36]) s+=`<ellipse cx="${ex}" cy="-12" rx="16" ry="${f(ry)}" fill="#fff"/><ellipse cx="${f(ex+lx)}" cy="${f(-12+ly)}" rx="8" ry="${f(Math.min(8,ry))}" fill="#1b1512"/>`; }
 const ns=(p.dx||0)>=0?1:-1;
 s+=`<path d="M${ns*2},-6 q${ns*13},30 ${-ns*3},38" stroke="${shade(sk,.7)}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
 if(c.must) s+=`<path d="M-38,52 Q0,33 38,52 Q19,62 0,55 Q-19,62 -38,52Z" fill="#1c1511"/>`;
 const my=74;
 if(o<0.1){ const sm=(p.smile==null?0.5:p.smile); s+=`<path d="M-22,${my-3} Q0,${f(my-3+16*sm)} 22,${my-3}" stroke="#5b2620" stroke-width="6" fill="none" stroke-linecap="round"/>`; }
 else { const ry=3+18*o, rx=19+5*o; s+=`<ellipse cx="0" cy="${my}" rx="${f(rx)}" ry="${f(ry)}" fill="#4a1411"/><rect x="${f(-rx*.6)}" y="${f(my-ry+1)}" width="${f(rx*1.2)}" height="${f(Math.min(6,ry*.5))}" rx="2" fill="#fff"/><ellipse cx="0" cy="${f(my+ry*.5)}" rx="${f(rx*.55)}" ry="${f(ry*.35)}" fill="#c9544f"/>`; }
 if(p.cheek) s+=`<ellipse cx="-58" cy="36" rx="17" ry="10" fill="#e8776a" opacity=".45"/><ellipse cx="58" cy="36" rx="17" ry="10" fill="#e8776a" opacity=".45"/>`;
 s+='</g>';
 if(c.hair=='cust'){ s+=`<path d="M-100,-16 C-122,-70 -120,-130 -80,-152 C-66,-184 -20,-194 8,-174 C42,-200 96,-178 102,-138 C128,-108 116,-58 102,-16 C99,-48 90,-72 70,-90 C40,-62 -10,-66 -42,-98 C-58,-78 -84,-66 -92,-50 C-96,-40 -98,-28 -100,-16Z" fill="${HC}"/><path d="M-70,-140 C-40,-166 -6,-160 8,-150 M20,-156 C48,-172 78,-156 88,-134 M-92,-98 C-80,-122 -58,-126 -44,-112" stroke="#3d2f27" stroke-width="6" fill="none" stroke-linecap="round" opacity=".85"/>`; }
 else if(c.hair=='short'){ s+=`<path d="M-95,-22 C-103,-104 -52,-132 0,-130 C56,-132 103,-102 95,-22 C86,-66 62,-88 0,-88 C-62,-88 -86,-66 -95,-22Z" fill="${HC}"/>`; }
 else { s+=`<path d="M-95,-16 C-106,-108 -58,-140 4,-138 C64,-138 104,-104 95,-16 C88,-60 70,-80 30,-78 C-10,-72 -50,-98 -95,-16Z" fill="${HC}"/>`; }
 return s;
}
function ik(S,T,L1,L2,bend){ let dx=T[0]-S[0],dy=T[1]-S[1],d=Math.hypot(dx,dy);const m=L1+L2-1;if(d>m){dx*=m/d;dy*=m/d;d=m;T=[S[0]+dx,S[1]+dy]}
 const a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a));return [[S[0]+dx*a/d-bend*dy*h/d,S[1]+dy*a/d+bend*dx*h/d],T]}
function arm(c,S,T,bend){const [E,H]=ik(S,T,140,132,bend);const M=[lerp(E[0],H[0],.5),lerp(E[1],H[1],.5)];
 return `<path d="M${f(E[0])},${f(E[1])} L${f(H[0])},${f(H[1])}" stroke="${c.skin}" stroke-width="40" stroke-linecap="round"/>`+
 `<path d="M${f(S[0])},${f(S[1])} L${f(E[0])},${f(E[1])} L${f(M[0])},${f(M[1])}" stroke="${c.shirt}" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`+
 `<path d="M${f(M[0])},${f(M[1])} l0.1,0" stroke="${shade(c.shirt,.86)}" stroke-width="60" stroke-linecap="round"/>`+
 `<circle cx="${f(H[0])}" cy="${f(H[1])}" r="27" fill="${c.skin}"/>`}
function leg(c,x,a1,a2){return `<g transform="translate(${x},-322) rotate(${f(a1)})"><path d="M0,0 L0,168" stroke="${c.pants}" stroke-width="80" stroke-linecap="round"/><g transform="translate(0,168) rotate(${f(a2)})"><path d="M0,0 L0,150" stroke="${c.pants}" stroke-width="66" stroke-linecap="round"/><path d="M-34,150 h78 q24,0 24,24 v8 h-102z" fill="${c.shoe}"/></g></g>`}
// person: origin = feet, ~770 tall at scale 1. returns {body, arms} so a table can sit between them
function person(c,p){
 const tr=`translate(${f(p.x)},${f(p.y)}) scale(${p.s}) rotate(${f(p.lean||0)})`, sd=shade(c.shirt,.84);
 let b=`<g transform="${tr}">`;
 const L=p.legs||[[0,0],[0,0]];
 b+=leg(c,-44,L[0][0],L[0][1])+leg(c,44,L[1][0],L[1][1]);
 b+=`<path d="M-90,-345 L90,-345 L88,-300 Q0,-288 -88,-300Z" fill="${c.pants}"/>`;
 b+=`<path d="M-114,-598 Q-60,-632 0,-628 Q60,-632 114,-598 Q104,-470 94,-338 Q0,-322 -94,-338 Q-104,-470 -114,-598Z" fill="${c.shirt}"/>`;
 b+=`<path d="M0,-612 L0,-334" stroke="${sd}" stroke-width="5"/>`;
 for(const by of [-560,-500,-440,-380]) b+=`<circle cx="0" cy="${by}" r="5" fill="${shade(c.shirt,1.25)}"/>`;
 b+=`<path d="M-44,-630 L0,-596 L-8,-560 L-58,-606Z" fill="${sd}"/><path d="M44,-630 L0,-596 L8,-560 L58,-606Z" fill="${sd}"/>`;
 if(c.hair!='cust') b+=`<rect x="-92" y="-348" width="184" height="16" fill="#0e0e10"/>`;
 b+=`<g transform="translate(${f(p.hx||0)},${f(-700+(p.hy||0))}) rotate(${f(p.hrot||0)}) scale(.64)">${head(c,p.h||{})}</g>`;
 b+='</g>';
 let a=`<g transform="${tr}">`;
 const hs=p.hands||[[-120,-360],[120,-360]];
 a+=arm(c,[-106,-584],hs[0],p.bendA==null?1:p.bendA)+arm(c,[106,-584],hs[1],p.bendB==null?-1:p.bendB);
 if(p.extra) a+=p.extra;
 a+='</g>';
 return {body:b,arms:a};
}

// ---------------------------------------------------------------- props
function roll(x,y,r,rot){return `<g transform="translate(${f(x)},${f(y)}) rotate(${rot||0})"><circle r="${r}" fill="#1b231f"/><circle r="${f(r*.8)}" fill="#f6f1e7"/><circle cx="${f(-r*.18)}" cy="${f(-r*.1)}" r="${f(r*.32)}" fill="#f28b3c"/><circle cx="${f(r*.22)}" cy="${f(r*.12)}" r="${f(r*.24)}" fill="#7fb24a"/><circle cx="${f(r*.05)}" cy="${f(-r*.28)}" r="${f(r*.16)}" fill="#f6c9b0"/></g>`}
function platter(cx,cy,w,n,gone,t){ const h=w*.27, r=w/(n*2.35); let s=`<g transform="translate(${f(cx)},${f(cy)})">`;
 s+=`<ellipse cx="0" cy="${f(h*.62)}" rx="${f(w*.53)}" ry="${f(h*.3)}" fill="#000" opacity=".18"/>`;
 s+=`<rect x="${f(-w/2)}" y="${f(-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h*.22)}" fill="#fbfaf7"/><rect x="${f(-w/2+6)}" y="${f(-h/2+6)}" width="${f(w-12)}" height="${f(h-12)}" rx="${f(h*.18)}" fill="none" stroke="#e3ded4" stroke-width="3"/>`;
 for(let i=0;i<n;i++){ if(i<gone)continue; const x=-w/2+w*.16+i*(w*.74/(n-1)); s+=roll(x,-h*.02,r,i*37); }
 let z='';for(let i=0;i<=n*2;i++){const x=-w/2+w*.12+i*(w*.8/(n*2));if(x<-w/2+w*.16+gone*(w*.74/(n-1))-r)continue;z+=(z?'L':'M')+f(x)+','+f(-h*.02+(i%2?-r*.7:r*.7))}
 if(z.length>12) s+=`<path d="${z}" stroke="#e9682f" stroke-width="${f(r*.2)}" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>`;
 s+=`<path d="M${f(w*.42)},${f(-h*.1)} q${f(r*.5)},${f(-r)} ${f(r)},0 q${f(-r*.2)},${f(r)} ${f(-r)},0Z" fill="#f4a3bd"/><circle cx="${f(w*.44)}" cy="${f(h*.22)}" r="${f(r*.42)}" fill="#8cc152"/>`;
 return s+'</g>';}
function bowl(x,y,r,col){return `<g transform="translate(${x},${y})"><ellipse cx="0" cy="${f(r*.5)}" rx="${f(r*1.05)}" ry="${f(r*.5)}" fill="#000" opacity=".16"/><ellipse rx="${r}" ry="${f(r*.62)}" fill="#fdfcfa"/><ellipse rx="${f(r*.78)}" ry="${f(r*.45)}" fill="${col}"/><ellipse cx="${f(-r*.25)}" cy="${f(-r*.12)}" rx="${f(r*.25)}" ry="${f(r*.1)}" fill="#fff" opacity=".35"/></g>`}
function napkin(x,y,k){return `<g transform="translate(${x},${y}) scale(${k})"><path d="M-70,0 L-40,-120 L-10,0Z" fill="#f4f4f2"/><path d="M-30,0 L0,-140 L30,0Z" fill="#fff"/><path d="M10,0 L40,-120 L70,0Z" fill="#ececea"/><path d="M-10,-60 v40 M0,-80 v60 M10,-60 v40" stroke="#b9b9c4" stroke-width="3"/><rect x="-78" y="-6" width="156" height="14" rx="4" fill="#3b3b40"/></g>`}
function glass(x,y,k){return `<g transform="translate(${x},${y}) scale(${k})" opacity=".75"><path d="M-26,-90 L26,-90 L20,0 L-20,0Z" fill="#dfeaf0" stroke="#fff" stroke-width="3"/><path d="M-16,-80 L-12,-10" stroke="#fff" stroke-width="4" opacity=".8"/></g>`}
function hexShelf(x,y,r,plant,t){let p='';for(let i=0;i<6;i++){const a=PI/6+i*PI/3;p+=(i?'L':'M')+f(x+r*cos(a))+','+f(y+r*sin(a))}
 let s=`<path d="${p}Z" fill="#f3f4f5" stroke="#23262a" stroke-width="${f(r*.07)}"/><path d="M${f(x-r*.86)},${f(y+r*.5)} L${f(x+r*.86)},${f(y+r*.5)}" stroke="#23262a" stroke-width="${f(r*.05)}"/>`;
 if(plant){const sw=sin(t*1.3+x)*5; s+=`<g transform="translate(${x},${f(y+r*.48)})"><g transform="rotate(${f(sw)})"><path d="M0,${f(-r*.2)} q${f(-r*.5)},${f(-r*.5)} ${f(-r*.15)},${f(-r*.75)} q${f(r*.05)},${f(r*.4)} ${f(r*.15)},${f(r*.75)} M0,${f(-r*.2)} q${f(r*.55)},${f(-r*.35)} ${f(r*.35)},${f(-r*.7)} q${f(-r*.3)},${f(r*.25)} ${f(-r*.35)},${f(r*.7)} M0,${f(-r*.2)} q0,${f(-r*.6)} ${f(r*.05)},${f(-r*.9)}" fill="#4f8f45" stroke="#3c7436" stroke-width="3"/></g><rect x="${f(-r*.2)}" y="${f(-r*.26)}" width="${f(r*.4)}" height="${f(r*.26)}" rx="3" fill="#d8d2c6"/></g>`}
 else s+=`<path d="M${f(x-r*.2)},${f(y+r*.48)} q${f(r*.2)},${f(-r*.7)} ${f(r*.4)},0Z" fill="#2c2f36"/>`;
 return s}
function patchChair(x,y,k){return `<g transform="translate(${x},${y}) scale(${k})"><path d="M-70,90 L-95,210 M70,90 L95,210 M-40,95 L-48,200 M40,95 L48,200" stroke="#b98a55" stroke-width="10" stroke-linecap="round"/>
 <path d="M-110,-70 Q-120,90 -60,100 L60,100 Q120,90 110,-70 Q60,-110 0,-110 Q-60,-110 -110,-70Z" fill="#efe6d2"/>
 <path d="M-110,-70 Q-60,-110 0,-110 L0,-20 L-112,-10Z" fill="#d94a3d"/><path d="M0,-110 Q60,-110 110,-70 L112,-10 L0,-20Z" fill="#e9d9a6"/>
 <path d="M-112,-10 L0,-20 L0,100 L-60,100 Q-115,90 -112,-10Z" fill="#f2efe6"/><path d="M0,-20 L112,-10 Q115,90 60,100 L0,100Z" fill="#5d7fa8"/>
 <path d="M10,-10 h90 M10,15 h95 M10,40 h95 M10,65 h85 M30,-18 v115 M60,-16 v114 M88,-13 v105" stroke="#e8eef6" stroke-width="3" opacity=".7"/><ellipse cx="0" cy="92" rx="88" ry="22" fill="#e7dcc3"/></g>`}
function tfeSign(x,y,r){return `<g transform="translate(${x},${y})"><circle r="${r}" fill="#1d1f22"/><circle r="${f(r*.86)}" fill="none" stroke="#d8d8d8" stroke-width="${f(r*.045)}"/><circle r="${f(r*.62)}" fill="none" stroke="#8f9499" stroke-width="${f(r*.03)}"/><rect x="${f(-r*1.08)}" y="${f(-r*.2)}" width="${f(r*2.16)}" height="${f(r*.4)}" rx="${f(r*.06)}" fill="#1d1f22"/><text x="0" y="${f(r*.15)}" font-size="${f(r*.44)}" font-weight="600" text-anchor="middle" fill="#f4f1ea" letter-spacing="${f(r*.06)}">T<tspan fill="#d8333a">F</tspan>E</text></g>`}
function pendant(x,t){const a=sin(t*1.1)*3.2;return `<g transform="translate(${x},0) rotate(${f(a)})"><path d="M0,0 L0,70" stroke="#1b1d20" stroke-width="5"/><circle cx="0" cy="170" r="150" fill="url(#glow)" opacity="${f(.5+.08*sin(t*5))}"/>
 <g fill="none" stroke="#1b1d20" stroke-width="7" stroke-linejoin="round"><path d="M0,70 L-95,120 L-70,225 L0,268 L70,225 L95,120Z"/><path d="M0,70 L-30,150 L-95,120 M0,70 L30,150 L95,120 M-30,150 L30,150 L0,268 L-30,150 L-70,225 M30,150 L70,225"/></g><circle cx="0" cy="168" r="22" fill="#fff3cf"/></g>`}
function spot(x,y,t,i){return `<circle cx="${x}" cy="${y}" r="70" fill="url(#glow)" opacity="${f(.55+.1*sin(t*3+i))}"/><ellipse cx="${x}" cy="${y}" rx="16" ry="11" fill="#fffdf3"/>`}

// ---------------------------------------------------------------- scenes
function wideBG(t){ let s='';
 s+=`<rect width="1080" height="1920" fill="#6d838f"/><rect width="1080" height="330" fill="#56686f"/>`;
 s+=`<rect x="0" y="330" width="170" height="1200" fill="#5f7480"/>`;
 // white side wall + shelves + speaker
 s+=`<rect x="830" y="330" width="250" height="1200" fill="#e8eaec"/><rect x="830" y="330" width="250" height="1200" fill="url(#wallsh)"/>`;
 s+=hexShelf(965,900,48,true,t)+hexShelf(1030,1010,44,true,t+2);
 s+=`<path d="M900,470 L900,640" stroke="#222" stroke-width="8"/><rect x="858" y="560" width="92" height="130" rx="10" fill="#1c1d20"/><circle cx="904" cy="640" r="26" fill="#2d2f33"/><circle cx="904" cy="590" r="10" fill="#2d2f33"/>`;
 // slatted wood back wall
 s+=`<rect x="150" y="540" width="700" height="990" fill="#6a4631"/>`;
 for(let x=150;x<850;x+=20) s+=`<rect x="${x}" y="540" width="9" height="990" fill="#4f3323"/>`;
 for(const gx of [300,640]) s+=`<rect x="${gx}" y="540" width="62" height="990" fill="#30363b"/><rect x="${gx+56}" y="560" width="7" height="960" fill="#ffe2a0" opacity="${f(.85+.1*sin(t*4+gx))}"/><rect x="${gx+40}" y="560" width="40" height="960" fill="url(#led)" opacity=".5"/>`;
 // wooden canopy curving on to the ceiling
 s+=`<path d="M0,250 L720,232 Q862,236 862,390 L862,560 L0,600Z" fill="#74492f"/>`;
 for(let i=0;i<30;i++){const y0=250+i*12.2; s+=`<path d="M0,${f(y0+4)} L${f(720+i*4.6)},${f(232+i*10.6)}" stroke="#52331f" stroke-width="5" opacity=".9"/>`}
 s+=`<path d="M0,600 L862,560 L862,575 L0,618Z" fill="#3b2416"/>`;
 s+=spot(70,440,t,1)+spot(250,520,t,2)+spot(560,385,t,3)+spot(585,535,t,4);
 s+=pendant(560,t);
 s+=tfeSign(520,905,92);
 // floor
 s+=`<rect x="0" y="1530" width="1080" height="390" fill="#8e989c"/><rect x="0" y="1530" width="1080" height="390" fill="url(#floor)"/>`;
 // teal sofa on the right
 s+=`<rect x="850" y="1290" width="230" height="130" rx="18" fill="#1f6f78"/><rect x="850" y="1400" width="230" height="130" rx="14" fill="#185a62"/>`;
 s+=patchChair(455,1330,1.0);
 return s;}
function table(sushi,gone,t){ let s='';

function draw(t){
 const s=srcTime(t), sh=shotAt(s), u=cl((s-sh[0])/Math.min(sh[1]-sh[0],4)), m=sh[2];
 let o=DEFS;
 if(m=='door') o+=door(t,s,sh,u);
 else if(m=='wide'||m=='waiter'||m=='wide2') o+=wide(t,s,sh,u);
 else if(m=='close'||m=='eat'||m=='delight') o+=close(t,s,sh,u);
 else if(m=='sushi'||m=='sushi2') o+=sushiScene(t,s,sh,u);
 else o+=logo(t,s);
 if(m!='logo') o+=dust(t)+`<rect width="1080" height="1920" fill="url(#vig)"/>`+caption(s);
 if(t<0.35) o+=`<rect width="1080" height="1920" fill="#000" opacity="${f(1-t/0.35)}"/>`;
